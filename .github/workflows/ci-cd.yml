name: CI / CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci-matrix:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["20.19.0", "22.16.0", "24.12.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm install

      - name: Lint
        run: npm run lint

      - name: Test with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Verify dist output
        run: |
          test -f dist/index.js || (echo "Missing ESM output" && exit 1)
          test -f dist/index.cjs || (echo "Missing CJS output" && exit 1)
          test -f dist/index.d.ts || (echo "Missing type declarations" && exit 1)
          test -f dist/index.d.cts || (echo "Missing CJS type declarations" && exit 1)

  # 对外只暴露这一个固定的 check 名。矩阵 job 的 check 名会带上矩阵值
  # （ci (20.19.0)、ci (1.22.x) 之类），把那种名字登记成 ruleset 的必需检查会和矩阵硬耦合 ——
  # 版本清单一改，那条必需检查就永远不再上报，PR 会永久卡在 pending。
  #
  # if: always() 是必需的：矩阵失败时本 job 仍要运行并断言失败，否则它会被跳过，
  # 而被跳过的必需检查在 GitHub 眼里不等于失败。
  CI:
    needs: [ci-matrix]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 汇总矩阵结果
        run: |
          echo "ci-matrix: ${{ needs.ci-matrix.result }}"
          [ "${{ needs.ci-matrix.result }}" = "success" ]

  publish:
    needs: CI
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.12.0"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm install

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
